basePath: /api/v1
definitions:
  admin.EnforceRequest:
    properties:
      duration_days:
        type: integer
      enforcement_type:
        description: warning, temporary_restriction, temporary_block, permanent_block,
          unblock
        type: string
      note:
        type: string
      reason:
        type: string
    required:
    - enforcement_type
    - reason
    type: object
  admin.ModerateRequest:
    properties:
      action:
        description: approve, reject, request_changes, suspend
        type: string
      note:
        type: string
      reason:
        type: string
    required:
    - action
    type: object
  admin.OverviewMetrics:
    properties:
      active_users:
        type: integer
      approved_listings:
        type: integer
      blocked_users:
        type: integer
      open_reports:
        type: integer
      pending_listings:
        type: integer
      pending_verifications:
        type: integer
      rejected_listings:
        type: integer
      total_listings:
        type: integer
      total_users:
        type: integer
    type: object
  admin.ResolveReportRequest:
    properties:
      action:
        description: resolve, dismiss
        type: string
      note:
        type: string
      reason:
        type: string
    required:
    - action
    type: object
  admin.ReviewVerificationRequest:
    properties:
      action:
        description: approve, reject, request_changes
        type: string
      note:
        type: string
      reason:
        type: string
    required:
    - action
    type: object
  admin.RoleUpdateRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  amenities.AmenitiesResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/amenities.AmenityCategoryResponse'
        type: array
      housing_type:
        type: string
    type: object
  amenities.AmenityCategoryResponse:
    properties:
      amenities:
        items:
          $ref: '#/definitions/amenities.AmenityItem'
        type: array
      id:
        type: string
      name:
        type: string
    type: object
  amenities.AmenityItem:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  auth.DevLoginIn:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      phone:
        type: string
      role:
        type: string
    required:
    - phone
    type: object
  auth.DevLoginOut:
    properties:
      access_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/auth.UserRead'
    type: object
  auth.ErrorResponse:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      details:
        description: Details is present only for VALIDATION_ERROR responses.
      message:
        example: Human-readable error description.
        type: string
    type: object
  auth.OTPRequestIn:
    properties:
      phone:
        type: string
      return_url:
        type: string
    required:
    - phone
    type: object
  auth.OTPRequestOut:
    properties:
      challenge_id:
        type: string
      expires_in:
        type: integer
    type: object
  auth.OTPVerifyIn:
    properties:
      challenge_id:
        type: string
      code:
        type: string
    required:
    - challenge_id
    - code
    type: object
  auth.OTPVerifyOut:
    properties:
      access_token:
        type: string
      is_new_user:
        type: boolean
      return_url:
        type: string
      token_type:
        type: string
    type: object
  auth.ProfileCompleteRequest:
    properties:
      email:
        maxLength: 255
        type: string
      first_name:
        maxLength: 100
        minLength: 1
        type: string
      last_name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - first_name
    - last_name
    type: object
  auth.RefreshOut:
    properties:
      access_token:
        type: string
      token_type:
        type: string
    type: object
  auth.UserRead:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/db.UserRole'
      status:
        $ref: '#/definitions/db.UserStatus'
      updated_at:
        type: string
    type: object
  db.AuditLog:
    properties:
      action:
        type: string
      admin_id:
        type: string
      admin_name:
        type: string
      created_at:
        type: string
      id:
        type: string
      new_status:
        type: string
      note:
        type: string
      old_status:
        type: string
      reason:
        type: string
      target_id:
        type: string
      target_type:
        type: string
    type: object
  db.Report:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      reason:
        type: string
      reporter_id:
        type: string
      resolution_note:
        type: string
      resolution_reason:
        type: string
      resolver_admin_id:
        type: string
      status:
        type: string
      target_id:
        type: string
      target_type:
        description: listing, user
        type: string
      updated_at:
        type: string
    type: object
  db.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/db.UserRole'
      status:
        $ref: '#/definitions/db.UserStatus'
      updated_at:
        type: string
    type: object
  db.UserRole:
    enum:
    - guest
    - host
    - admin
    type: string
    x-enum-varnames:
    - UserRoleGuest
    - UserRoleHost
    - UserRoleAdmin
  db.UserStatus:
    enum:
    - pending_profile
    - active
    - suspended
    - banned
    type: string
    x-enum-varnames:
    - UserStatusPendingProfile
    - UserStatusActive
    - UserStatusSuspended
    - UserStatusBanned
  db.VerificationRequest:
    properties:
      admin_note:
        type: string
      created_at:
        type: string
      documents:
        items:
          type: integer
        type: array
      id:
        type: string
      legal_name:
        type: string
      provider_type:
        description: individual, individual_entrepreneur, self_employed, legal_entity
        type: string
      rejection_reason:
        type: string
      requested_changes:
        items:
          type: integer
        type: array
      status:
        type: string
      unp:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  geo.GeoSuggestItem:
    properties:
      city:
        type: string
      country:
        type: string
      house_number:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      raw_address:
        type: string
      street:
        type: string
    type: object
  geo.GeoSuggestResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/geo.GeoSuggestItem'
        type: array
    type: object
  listings.DraftCreateRequest:
    properties:
      type:
        type: string
    required:
    - type
    type: object
  listings.DraftCreateResponse:
    properties:
      current_step:
        type: integer
      draft_id:
        type: string
    type: object
  listings.DraftDetailResponse:
    properties:
      allow_children:
        type: boolean
      allow_parties:
        type: boolean
      allow_pets:
        type: boolean
      allow_smoking:
        type: boolean
      amenities:
        items:
          type: string
        type: array
      bathrooms_count:
        type: integer
      beds_count:
        type: integer
      checkin_from:
        type: string
      checkout_until:
        type: string
      created_at:
        type: string
      currency:
        type: string
      current_step:
        type: integer
      deposit_required:
        type: boolean
      description:
        type: string
      floor:
        type: integer
      host_id:
        type: string
      id:
        type: string
      max_guests:
        type: integer
      media_ids:
        items:
          type: string
        type: array
      min_nights:
        type: integer
      name:
        type: string
      price_per_night:
        type: number
      rooms_count:
        type: integer
      square:
        type: number
      status:
        type: string
      total_floors:
        type: integer
      type:
        type: string
      updated_at:
        type: string
      with_invoicing:
        type: boolean
    type: object
  listings.DraftStep2Request:
    properties:
      bathrooms_count:
        maximum: 20
        minimum: 1
        type: integer
      beds_count:
        maximum: 30
        minimum: 1
        type: integer
      floor:
        maximum: 150
        minimum: 1
        type: integer
      max_guests:
        maximum: 50
        minimum: 1
        type: integer
      name:
        maxLength: 100
        minLength: 10
        type: string
      rooms_count:
        maximum: 30
        minimum: 1
        type: integer
      square:
        type: number
      total_floors:
        maximum: 150
        minimum: 1
        type: integer
    required:
    - bathrooms_count
    - beds_count
    - floor
    - max_guests
    - name
    - rooms_count
    - square
    - total_floors
    type: object
  listings.DraftStep3Request:
    properties:
      media_ids:
        items:
          type: string
        maxItems: 15
        minItems: 5
        type: array
    required:
    - media_ids
    type: object
  listings.DraftStep4Request:
    properties:
      amenities:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - amenities
    type: object
  listings.DraftStep5Request:
    properties:
      checkin_from:
        description: '"HH:MM" or "HH:MM:SS"'
        type: string
      checkout_until:
        description: '"HH:MM" or "HH:MM:SS"'
        type: string
      currency:
        type: string
      min_nights:
        maximum: 30
        minimum: 1
        type: integer
      price_per_night:
        type: number
      rules:
        $ref: '#/definitions/listings.ListingRules'
    required:
    - checkin_from
    - checkout_until
    - currency
    - min_nights
    - price_per_night
    type: object
  listings.DraftStep6Request:
    properties:
      description:
        maxLength: 5000
        minLength: 30
        type: string
    required:
    - description
    type: object
  listings.DraftStepResponse:
    properties:
      current_step:
        type: integer
      draft_id:
        type: string
      status:
        type: string
    type: object
  listings.HostSchema:
    properties:
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  listings.ListingHostReadSchema:
    properties:
      allow_children:
        type: boolean
      allow_parties:
        type: boolean
      allow_pets:
        type: boolean
      allow_smoking:
        type: boolean
      amenities:
        items:
          type: string
        type: array
      bathrooms_count:
        type: integer
      beds_count:
        type: integer
      checkin_from:
        type: string
      checkout_until:
        type: string
      created_at:
        type: string
      currency:
        type: string
      deposit_required:
        type: boolean
      description:
        type: string
      floor:
        type: integer
      id:
        type: string
      max_guests:
        type: integer
      media:
        items:
          type: string
        type: array
      min_nights:
        type: integer
      name:
        type: string
      price_per_night:
        type: number
      rooms_count:
        type: integer
      square:
        type: number
      status:
        type: string
      total_floors:
        type: integer
      type:
        type: string
      updated_at:
        type: string
      with_invoicing:
        type: boolean
    type: object
  listings.ListingPublicSchema:
    properties:
      allow_children:
        type: boolean
      allow_parties:
        type: boolean
      allow_pets:
        type: boolean
      allow_smoking:
        type: boolean
      amenities:
        items:
          type: string
        type: array
      bathrooms_count:
        type: integer
      beds_count:
        type: integer
      checkin_from:
        type: string
      checkout_until:
        type: string
      created_at:
        type: string
      currency:
        type: string
      deposit_required:
        type: boolean
      description:
        type: string
      floor:
        type: integer
      host:
        $ref: '#/definitions/listings.HostSchema'
      id:
        type: string
      max_guests:
        type: integer
      media:
        items:
          type: string
        type: array
      min_nights:
        type: integer
      name:
        type: string
      price_per_night:
        type: number
      rooms_count:
        type: integer
      square:
        type: number
      total_floors:
        type: integer
      type:
        type: string
      with_invoicing:
        type: boolean
    type: object
  listings.ListingRules:
    properties:
      allow_children:
        type: boolean
      allow_parties:
        type: boolean
      allow_pets:
        type: boolean
      allow_smoking:
        type: boolean
      deposit_required:
        type: boolean
      with_invoicing:
        type: boolean
    type: object
  listings.ListingSubmitResponse:
    properties:
      listing_id:
        type: string
      status:
        type: string
    type: object
  media.CompleteResponse:
    properties:
      file_key:
        type: string
      media_id:
        type: string
      status:
        type: string
    type: object
  media.PresignRequest:
    properties:
      content_type:
        type: string
      file_size_bytes:
        minimum: 1
        type: integer
    required:
    - content_type
    - file_size_bytes
    type: object
  media.PresignResponse:
    properties:
      expires_in:
        type: integer
      file_key:
        type: string
      media_id:
        type: string
      upload_url:
        type: string
    type: object
  notifications.NotificationListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/notifications.NotificationRead'
        type: array
      total:
        type: integer
      unread_count:
        type: integer
    type: object
  notifications.NotificationRead:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      message:
        type: string
      payload:
        items:
          type: integer
        type: array
      read_at:
        type: string
      title:
        type: string
      type:
        type: string
      user_id:
        type: string
    type: object
  notifications.SuccessResponse:
    properties:
      success:
        type: boolean
    type: object
  notifications.UnreadCountResponse:
    properties:
      unread_count:
        type: integer
    type: object
host: localhost:8000
info:
  contact:
    email: dev@flickey.com
    name: Flickey Dev Team
  description: Property-rental platform backend. Provides OTP-based authentication,
    multi-step listing wizard, media upload workflow, amenity catalogue, and an admin
    moderation panel.
  license:
    name: MIT
  termsOfService: http://flickey.com/terms/
  title: Flickey Go API
  version: "1.0"
paths:
  /admin/audit:
    get:
      description: Returns recent administrative audit log entries.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.AuditLog'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - Admin
  /admin/listings:
    get:
      description: Returns a list of listings, optionally filtered by status.
      parameters:
      - description: Listing status filter (pending, active, rejected, suspended,
          archived)
        enum:
        - pending
        - active
        - rejected
        - suspended
        - archived
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of listings with host details
          schema:
            items:
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all listings
      tags:
      - Admin
  /admin/listings/{id}:
    get:
      description: Returns full listing details for moderation.
      parameters:
      - description: Listing UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: INVALID_ID
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: LISTING_NOT_FOUND
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get listing details
      tags:
      - Admin
  /admin/listings/{id}/moderate:
    post:
      consumes:
      - application/json
      description: Approve, reject, or suspend a listing. Transitions state and records
        an audit log.
      parameters:
      - description: Listing UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Moderation action (approve/reject/request_changes/suspend) and
          reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.ModerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Moderate a listing
      tags:
      - Admin
  /admin/overview:
    get:
      description: Returns counts of total users, listings, pending verifications,
        active listings, etc.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.OverviewMetrics'
        "401":
          description: MISSING_TOKEN / INVALID_TOKEN
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: INSUFFICIENT_ROLE
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get admin overview metrics
      tags:
      - Admin
  /admin/reports:
    get:
      description: Returns user/listing reports optionally filtered by status.
      parameters:
      - description: Report status filter (pending, resolved, dismissed)
        enum:
        - pending
        - resolved
        - dismissed
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.Report'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List reports
      tags:
      - Admin
  /admin/reports/{id}/resolve:
    post:
      consumes:
      - application/json
      description: Marks a moderation report as resolved or dismissed, recording note
        and reason.
      parameters:
      - description: Report UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Resolution action (resolve/dismiss) and details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.ResolveReportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.Report'
        "400":
          description: VALIDATION_ERROR / INVALID_ID
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Resolve or dismiss a report
      tags:
      - Admin
  /admin/users:
    get:
      description: Returns a list of users, optionally filtered by role and status.
      parameters:
      - description: Filter by role
        in: query
        name: role
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.User'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Admin
  /admin/users/{id}:
    get:
      description: Returns a user's details and their listings.
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: INVALID_ID
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: USER_NOT_FOUND
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user details
      tags:
      - Admin
  /admin/users/{id}/enforce:
    post:
      consumes:
      - application/json
      description: Applies a warning, temporary block, or ban to a user. Records an
        audit log.
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
