    post:
      consumes:
      - application/json
      description: Sends a one-time password to the provided phone number and returns
        a challenge ID used in the verify step.
      parameters:
      - description: Phone number (E.164) and optional return URL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.OTPRequestIn'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.OTPRequestOut'
        "400":
          description: VALIDATION_ERROR – missing or invalid phone
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "429":
          description: RATE_LIMIT_EXCEEDED – too many OTP requests
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Request an OTP code
      tags:
      - Auth
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Validates the 6-digit OTP against the challenge ID. On success
        issues an access token in the body and sets an HttpOnly refresh_token cookie.
      parameters:
      - description: Challenge ID and 6-digit OTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.OTPVerifyIn'
      produces:
      - application/json
      responses:
        "200":
          description: access_token (JWT bearer) + is_new_user flag
          schema:
            $ref: '#/definitions/auth.OTPVerifyOut'
        "400":
          description: VALIDATION_ERROR – missing fields or wrong OTP format
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: INVALID_OTP / OTP_EXPIRED / CHALLENGE_NOT_FOUND
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "429":
          description: RATE_LIMIT_EXCEEDED
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
