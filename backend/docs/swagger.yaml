            $ref: '#/definitions/listings.ListingSubmitResponse'
        "400":
          description: MISSING_IDEMPOTENCY_KEY / INVALID_IDEMPOTENCY_KEY / DRAFT_INCOMPLETE
            / VALIDATION_ERROR
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: MISSING_TOKEN / INVALID_TOKEN
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: PROFILE_INCOMPLETE
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: DRAFT_NOT_FOUND
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: DRAFT_ALREADY_SUBMITTED / IDEMPOTENCY_CONFLICT
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit draft for review
      tags:
      - Listings
  /listings/my:
    get:
      description: Returns all published (and pending) listings owned by the authenticated
        host.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/listings.ListingHostReadSchema'
            type: array
        "401":
          description: MISSING_TOKEN / INVALID_TOKEN
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: PROFILE_INCOMPLETE
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get host's own listings
      tags:
      - Listings
  /media/{media_id}/complete:
    post:
      description: Verifies uploaded object existence, size, and binary magic bytes
        in storage. Marks media status as 'uploaded'.
      parameters:
      - description: Media UUID
        format: uuid
        in: path
        name: media_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Upload confirmation and file key
          schema:
            $ref: '#/definitions/media.CompleteResponse'
        "400":
          description: INVALID_MEDIA_ID / INVALID_MEDIA_STATUS
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: MISSING_TOKEN / INVALID_TOKEN
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: PROFILE_INCOMPLETE / MEDIA_NOT_OWNED
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "422":
          description: OBJECT_NOT_FOUND / INVALID_FILE_SIZE / INVALID_FILE_SIGNATURE
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Complete media upload
      tags:
      - Media
  /media/dev-upload/{file_key}:
    get:
      description: Retrieves raw media bytes directly from local dev storage. **Dev
        only.**
      parameters:
      - description: Storage file path/key
        in: path
        name: file_key
        required: true
        type: string
      produces:
      - image/jpeg
      - image/png
      - image/webp
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: FILE_NOT_FOUND
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Dev get uploaded file
      tags:
      - Media
    put:
      consumes:
      - application/octet-stream
      description: Uploads file content directly to local development storage without
        S3. **Dev only.**
      parameters:
      - description: Storage file path/key
        in: path
        name: file_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: READ_ERROR
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: STORAGE_ERROR
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Dev direct file upload
      tags:
      - Media
  /media/presign:
    post:
      consumes:
      - application/json
      description: Validates content type and file size, creates a media record with
        'pending' status, and returns a presigned upload URL.
      parameters:
      - description: Media upload request parameters (content_type and file_size_bytes)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/media.PresignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Presigned upload URL and media metadata
          schema:
            $ref: '#/definitions/media.PresignResponse'
        "400":
          description: VALIDATION_ERROR / INVALID_CONTENT_TYPE / INVALID_FILE_SIZE
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: MISSING_TOKEN / INVALID_TOKEN
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: PROFILE_INCOMPLETE
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Request presigned upload URL
      tags:
      - Media
  /notifications:
    get:
      description: Returns a paginated list of notifications for the authenticated
        user.
      parameters:
      - description: Limit (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Filter by unread only
        in: query
        name: unread_only
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notifications.NotificationListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user notifications
      tags:
      - Notifications
  /notifications/{id}/read:
    patch:
      description: Marks a specific notification as read.
      parameters:
      - description: Notification UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notifications.SuccessResponse'
        "400":
          description: INVALID_ID
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark notification as read
      tags:
      - Notifications
  /notifications/read-all:
    post:
      description: Marks all unread notifications for the user as read.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notifications.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark all notifications as read
      tags:
      - Notifications
  /notifications/stream:
    get:
      description: Establishes a persistent SSE stream to deliver real-time notifications
        to the client. Token can be passed in Authorization header or as ?token= query
        param.
      parameters:
      - description: JWT access token (for EventSource)
        in: query
        name: token
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'event: notification\ndata: {...}\n\n'
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream real-time notifications (SSE)
      tags:
      - Notifications
  /notifications/unread-count:
    get:
      description: Returns total count of unread notifications for the authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notifications.UnreadCountResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get unread notifications count
      tags:
      - Notifications
securityDefinitions:
  BearerAuth:
    description: 'JWT access token. Format: **Bearer {token}**'
    in: header
    name: Authorization
    type: apiKey
  CookieAuth:
    description: HttpOnly refresh token cookie set by /auth/verify-otp and rotated
      by /auth/refresh.
    in: cookie
    name: refresh_token
    type: apiKey
swagger: "2.0"
