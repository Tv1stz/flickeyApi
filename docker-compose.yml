services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flickey
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental_dev
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d flickey"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=dev
      - PORT=8080
      - DATABASE_URL=postgresql://rental:rental_dev@postgres:5432/flickey
      - REDIS_URL=redis://redis:6379/0
      - GEOCODER_URL=http://geocoder:2322
      - JWT_SECRET=your-super-secret-jwt-key-must-be-at-least-32-bytes-long
      - COOKIE_SECURE=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  geocoder:
    image: ringofstorms/photon:latest
    container_name: flickey-geocoder
    restart: unless-stopped
    ports:
      - "2322:2322"
    volumes:
      - photon_data:/photon/photon_data
    environment:
      - PHOTON_LANG=ru
      - PHOTON_COUNTRIES=by,ru

volumes:
  pgdata:
  photon_data:
